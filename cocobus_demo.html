     .addTo(map).bindTooltip(s.name);

function pointAt(off) {
    const c = D.cum;
    let lo = 0, hi = c.length - 1;
    while (lo < hi - 1) { const mid = (lo + hi) >> 1; (c[mid] <= off) ? lo = mid : hi = mid; }
    const seg = c[lo + 1] - c[lo] || 1, t = Math.max(0, Math.min(1, (off - c[lo]) / seg));
    const a = D.shape[lo], b = D.shape[lo + 1];
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
// 仮想時計: speed倍で進む。リセットで実時刻 or 9:00
let speed = 30;
let simSec = (() => { const n = new Date(); return n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds(); })();
let lastReal = performance.now();
function setSpeed(s, btn) {
    speed = s;
    for (const id of ['b1','b30','b120']) document.getElementById(id).classList.remove('on');
    if (btn) document.getElementById(btn).classList.add('on');
    document.getElementById('mode').textContent = s === 1 ? '' : '(' + s + 'x)';
}
document.getElementById('b1').onclick = () => { setSpeed(1, 'b1');
    const n = new Date(); simSec = n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds(); };
document.getElementById('b30').onclick = () => setSpeed(30, 'b30');
document.getElementById('b120').onclick = () => setSpeed(120, 'b120');
document.getElementById('brst').onclick = () => { simSec = 9*3600; };
setSpeed(30, 'b30');
const markers = new Map();
function fmt(sec) {
    sec = ((sec % 86400) + 86400) % 86400;
    const h = Math.floor(sec/3600), mi = Math.floor(sec/60) % 60, se = Math.floor(sec) % 60;
    return String(h).padStart(2,'0') + ':' + String(mi).padStart(2,'0') + ':' + String(se).padStart(2,'0');
}
function tick() {
    const nowR = performance.now();
    simSec += (nowR - lastReal) / 1000 * speed;
    lastReal = nowR;
    if (simSec > 20*3600) simSec = 9*3600;   // 20時を過ぎたら9時に巻き戻してループ
    document.getElementById('clock').textContent = fmt(simSec);
    let active = 0;
    D.trips.forEach((tt, k) => {
        const running = simSec >= tt[0] && simSec <= tt[tt.length - 1];
        if (!running) { if (markers.has(k)) { map.removeLayer(markers.get(k)); markers.delete(k); } return; }
        active++;
        let i = 0;
        while (i < tt.length - 2 && tt[i + 1] <= simSec) i++;
        const t0 = tt[i], t1 = tt[i + 1], o0 = D.stops[i].off, o1 = D.stops[i + 1].off;
        const r = t1 > t0 ? Math.max(0, Math.min(1, (simSec - t0) / (t1 - t0))) : 1;
        const p = pointAt(o0 + (o1 - o0) * r);
        if (!markers.has(k)) {
            markers.set(k, L.marker(p, {icon: L.divIcon({className: 'busicon', iconSize: [16, 16]})})

        } else { markers.get(k).setLatLng(p); }
    });

}
lastReal = performance.now(); tick(); setInterval(tick, 100);
